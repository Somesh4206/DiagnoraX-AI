name: Build Android APK

# Builds the DiagnoraX AI Android APK from the static Next.js export and
# attaches it to a GitHub Release whenever a v* tag is pushed.
# The APK is always available at:
#   https://github.com/Somesh4206/DiagnoraX-AI/releases/latest/download/DiagnoraX-AI.apk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 21 (Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's ubuntu-latest runners ship the Android SDK pre-installed
      # (ANDROID_HOME is set) — locate sdkmanager and install what we need.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)"
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static web app (APK build)
        run: |
          # API routes cannot exist in a static export — the APK runs the
          # on-device engine instead. Remove them for this build only.
          rm -rf src/app/api
          BUILD_TARGET=apk bun run build:apk

      - name: Sync web assets into Android project
        run: bunx cap sync android

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/versionCode .*/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          echo "Version ${VERSION} (code ${GITHUB_RUN_NUMBER})"
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DiagnoraX-AI.apk
          ls -la DiagnoraX-AI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiagnoraX-AI-APK
          path: DiagnoraX-AI.apk
          retention-days: 90

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DiagnoraX-AI.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 📲 DiagnoraX AI — Android APK

            **Direct download:** `DiagnoraX-AI.apk` (below)

            ### Install on your phone
            1. Download `DiagnoraX-AI.apk` on your Android device (Android 6.0+)
            2. Tap the file → allow "Install from unknown sources" if asked
            3. Open **DiagnoraX AI** from your launcher

            The app works **fully offline** — symptom triage and history run on-device.
            Optionally connect a cloud AI server in **Profile → AI engine**.

            > ⚠️ Health information only — never a diagnosis. In an emergency call 112 (India) / 911.
